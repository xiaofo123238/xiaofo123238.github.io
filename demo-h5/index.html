<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文先思演示H5</title><style>
*{box-sizing:border-box}body{margin:0;background:#fbf8f3;color:#596575;font:14px/1.9 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:24px 17px 16px;background:linear-gradient(135deg,#fff0dc,#ffece4)}header small{color:#b18d67;font-size:10px}h1{font-size:22px;color:#8f6f4a;margin:6px 0}header p{font-size:12px;color:#a59482;margin:0}main{padding:15px;display:grid;gap:14px}section{padding:17px;background:#fff;border:1px solid #f0e7db;border-radius:13px;min-width:0}h2{font-size:17px;color:#596575;margin:0 0 10px}p{margin:6px 0 13px;font-size:13px}label{display:grid;gap:6px;font-size:12px;color:#8c96a1;margin:0 0 14px}input,select,textarea{font:inherit;border:1px solid #e7e9ec;background:#fafbfc;border-radius:8px;padding:9px;color:#657184;width:100%;min-width:0}textarea{min-height:86px}button{font:inherit;background:#ed9454;color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;line-height:1.6}button.secondary{background:#fff3e3;color:#b88b58}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{font-size:12px;flex:1;min-width:60px}.note{font-size:11px;color:#b49c86}ul,ol{padding-left:20px;font-size:13px}.result{padding:13px;border-radius:10px;background:#eef8ed;color:#719678;font-size:13px}.hidden{display:none!important}footer{padding:10px 15px 25px;color:#b5a595;font-size:10px;text-align:center}a{color:#bf8b58;overflow-wrap:anywhere}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #1686ce;outline-offset:2px}
</style></head><body><header><small>文先思调剂 · 独立H5演示</small><h1 id="page-title">备考阅读手册</h1><p>资料与提交均为本机演示</p></header><main>
<div id="guide"><section><div class="tabs" aria-label="阅读章节"><button data-chapter="0">确定目标</button><button data-chapter="1" class="secondary">资料准备</button><button data-chapter="2" class="secondary">每周复盘</button></div><h2 id="chapter-title" style="margin-top:17px"></h2><p id="chapter-text"></p><ul id="chapter-items"></ul></section></div>
<div id="form-area" class="hidden"><section><h2 id="form-title">备考需求小问卷</h2><p id="form-intro">记录现阶段的目标，形成明确的下一步。</p><form id="demo-form"><label>称呼<input name="name" required maxlength="30" placeholder="演示同学"></label><label>备考阶段<select name="stage"><option>初试择校</option><option>初试复习</option><option>复试准备</option><option>调剂准备</option></select></label><label>意向专业<input name="major" required maxlength="60" placeholder="如计算机技术"></label><label>最需要的帮助<textarea name="needs" required minlength="4" maxlength="500" placeholder="至少填写4个字"></textarea></label><label>方便参与的时间<select name="time"><option>工作日晚上</option><option>周末上午</option><option>周末下午</option></select></label><button type="submit">保存演示问卷</button></form><div id="result" class="result hidden" role="status"></div><button id="again" class="secondary hidden" style="margin-top:13px">重新填写</button></section></div>
<section><h2>使用说明</h2><p>这是独立运行的演示网页。没有真实院校申请、商业报名或外部提交；嵌入主站时，提交内容可保存在本机申请记录。</p><p class="note">正式报考信息请核对院校当年招生要求。</p></section></main><footer>文先思调剂 · H5前端演示</footer><script>
const type=new URLSearchParams(location.search).get('type')||'guide';const chapters=[{title:'01 · 确定方向',text:'先看专业与初试科目，再看院校地区和培养方式。为每个目标保留可核实的资料入口。',items:['确认本科专业与报考资格','对照专业课与数学、英语科目','建立冲、稳、保候选清单']},{title:'02 · 资料准备',text:'按学校建立资料目录，准备证件、成绩单、个人介绍和专业经历。演示清单不能替代院校要求。',items:['核对院校复试通知','整理本科成绩与学籍材料','准备英语自我介绍与项目讲解']},{title:'03 · 每周复盘',text:'每周记录资料变化、复习结果和需要核实的问题，减少重复搜索与遗漏。',items:['更新目标顺序与申请记录','记录一项薄弱知识并完成练习','复查时间冲突与材料截止时间']}];function renderChapter(index){const row=chapters[index];document.querySelector('#chapter-title').textContent=row.title;document.querySelector('#chapter-text').textContent=row.text;const list=document.querySelector('#chapter-items');list.replaceChildren(...row.items.map(item=>{const li=document.createElement('li');li.textContent=item;return li;}));document.querySelectorAll('[data-chapter]').forEach(button=>{button.className=Number(button.dataset.chapter)===index?'':'secondary';button.setAttribute('aria-pressed',String(Number(button.dataset.chapter)===index));});}document.querySelectorAll('[data-chapter]').forEach(button=>button.addEventListener('click',()=>renderChapter(Number(button.dataset.chapter))));renderChapter(0);
if(type==='questionnaire'||type==='activity'){document.querySelector('#guide').classList.add('hidden');document.querySelector('#form-area').classList.remove('hidden');if(type==='activity'){document.querySelector('#page-title').textContent='复试体验活动';document.querySelector('#form-title').textContent='预约演示体验';document.querySelector('#form-intro').textContent='模拟一场材料梳理与专业问答活动，仅记录本机体验意向。';document.querySelector('button[type=submit]').textContent='保存演示报名';}else document.querySelector('#page-title').textContent='备考需求小问卷';}
document.querySelector('#demo-form').addEventListener('submit',event=>{event.preventDefault();const payload=Object.fromEntries(new FormData(event.currentTarget));payload.kind=type;const result=document.querySelector('#result');result.textContent=payload.name+'，你的演示'+(type==='activity'?'报名':'问卷')+'已记录。下一步：整理'+payload.major+'的报考要求，并列出需要核实的问题。';result.classList.remove('hidden');event.currentTarget.classList.add('hidden');document.querySelector('#again').classList.remove('hidden');try{localStorage.setItem('wxs-h5-last',JSON.stringify(payload));}catch{}if(parent!==window)parent.postMessage({type:'WXS_H5_SUBMIT',payload},location.origin);});document.querySelector('#again').addEventListener('click',()=>{document.querySelector('#demo-form').classList.remove('hidden');document.querySelector('#result').classList.add('hidden');document.querySelector('#again').classList.add('hidden');});
</script></body></html>
